<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hossein — Portfolio</title>
<meta name="description" content="Hossein's portfolio — Telegram bots and developer tools. Projects are synced live from pinned GitHub repositories.">
<meta name="theme-color" content="#0b0d12">
<meta property="og:title" content="Hossein — Portfolio">
<meta property="og:description" content="Telegram bots and developer tools, synced live from pinned GitHub repositories.">
<meta property="og:type" content="website">
<link rel="icon" href="https://avatars.githubusercontent.com/u/71749223?s=64&v=4">
<style>
  :root {
    --bg: #0b0d12;
    --bg-soft: #10131a;
    --card: #141822;
    --card-hover: #1a1f2c;
    --border: #262c3b;
    --border-strong: #333b50;
    --text: #e8ecf4;
    --text-muted: #8b94a8;
    --accent: #6ea8ff;
    --accent-strong: #8ab4ff;
    --glow-1: rgba(110, 168, 255, .10);
    --glow-2: rgba(155, 135, 255, .08);
    --shadow: 0 12px 32px rgba(0, 0, 0, .35);
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #f7f8fb;
      --bg-soft: #ffffff;
      --card: #ffffff;
      --card-hover: #ffffff;
      --border: #e3e7ee;
      --border-strong: #c9d1de;
      --text: #171c26;
      --text-muted: #5b6472;
      --accent: #2b6cb0;
      --accent-strong: #1a4e8a;
      --glow-1: rgba(43, 108, 176, .08);
      --glow-2: rgba(120, 100, 220, .07);
      --shadow: 0 12px 32px rgba(23, 28, 38, .08);
    }
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 16px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
  }
  a { color: var(--accent); text-decoration: none; }
  a:hover { color: var(--accent-strong); }

  .glow {
    position: fixed; inset: 0; z-index: -1; pointer-events: none;
    background:
      radial-gradient(600px 420px at 18% -8%, var(--glow-1), transparent 70%),
      radial-gradient(700px 480px at 85% 12%, var(--glow-2), transparent 70%);
  }

  .wrap { max-width: 1020px; margin: 0 auto; padding: 0 24px; }

  /* ---------- hero ---------- */
  .hero { padding: 84px 0 56px; text-align: center; }
  .avatar-ring {
    display: inline-block; padding: 4px; border-radius: 50%;
    background: conic-gradient(from 210deg, var(--accent), transparent 40%, var(--accent));
  }
  .avatar {
    display: block; width: 128px; height: 128px; border-radius: 50%;
    border: 3px solid var(--bg);
  }
  .hero h1 {
    margin: 22px 0 6px; font-size: clamp(2rem, 5vw, 2.8rem);
    letter-spacing: -.02em; line-height: 1.15;
  }
  .hero .handle { color: var(--text-muted); font-size: .95rem; margin: 0 0 14px; }
  .hero .tagline { max-width: 560px; margin: 0 auto; color: var(--text-muted); font-size: 1.06rem; }
  .stats {
    display: flex; gap: 10px; justify-content: center; flex-wrap: wrap;
    margin-top: 26px;
  }
  .stat {
    display: inline-flex; align-items: center; gap: 7px;
    background: var(--card); border: 1px solid var(--border);
    border-radius: 999px; padding: 6px 14px;
    font-size: .86rem; color: var(--text-muted);
  }
  .stat b { color: var(--text); font-weight: 600; }
  .stat svg { width: 14px; height: 14px; }

  /* ---------- projects ---------- */
  .projects { padding: 24px 0 72px; }
  .section-head {
    display: flex; align-items: baseline; justify-content: space-between;
    gap: 12px; flex-wrap: wrap; margin-bottom: 20px;
  }
  .section-head h2 {
    margin: 0; font-size: 1.35rem; letter-spacing: -.01em;
    display: flex; align-items: center; gap: 10px;
  }
  .sync-note { font-size: .85rem; color: var(--text-muted); }
  .sync-note .dot {
    display: inline-block; width: 7px; height: 7px; border-radius: 50%;
    background: #3fb950; margin-right: 6px; vertical-align: 1px;
  }

  .grid {
    display: grid; gap: 16px;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
  }
  .card {
    position: relative; display: flex; flex-direction: column; gap: 10px;
    background: var(--card); border: 1px solid var(--border);
    border-radius: 14px; padding: 20px;
    transition: transform .18s ease, border-color .18s ease, background .18s ease, box-shadow .18s ease;
    opacity: 0; transform: translateY(10px);
    animation: rise .5s ease forwards;
  }
  .card:hover {
    background: var(--card-hover);
    border-color: var(--border-strong);
    transform: translateY(-3px);
    box-shadow: var(--shadow);
  }
  @keyframes rise { to { opacity: 1; transform: none; } }
  .card-top { display: flex; align-items: center; gap: 8px; }
  .card-top .repo-icon { width: 16px; height: 16px; color: var(--text-muted); flex: none; }
  .card h3 {
    margin: 0; font-size: 1.05rem; font-weight: 600; letter-spacing: -.01em;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .card h3 a {
    color: var(--text);
  }
  .card h3 a:hover { color: var(--accent); }
  .card .ext { margin-left: auto; color: var(--text-muted); flex: none; }
  .card .ext svg { width: 14px; height: 14px; display: block; }
  .card .ext:hover { color: var(--accent); }
  .card .desc {
    margin: 0; color: var(--text-muted); font-size: .92rem;
    display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden;
  }
  .card .meta {
    margin-top: auto; display: flex; align-items: center; gap: 14px;
    font-size: .84rem; color: var(--text-muted); flex-wrap: wrap;
  }
  .lang { display: inline-flex; align-items: center; gap: 6px; }
  .lang i {
    width: 10px; height: 10px; border-radius: 50%;
    background: var(--dot, #8b94a8); display: inline-block;
  }
  .meta .with-icon { display: inline-flex; align-items: center; gap: 4px; }
  .meta svg { width: 13px; height: 13px; }
  .home-chip {
    display: inline-flex; align-items: center; gap: 5px;
    font-size: .8rem; padding: 3px 10px; border-radius: 999px;
    border: 1px solid var(--border); color: var(--text-muted);
  }
  .home-chip svg { width: 13px; height: 13px; }
  .home-chip:hover { border-color: var(--accent); color: var(--accent); }

  .card a.stretch::before {
    content: ""; position: absolute; inset: 0; border-radius: 14px;
  }
  .card .ext, .card .home-chip { z-index: 1; position: relative; }

  .empty, .error {
    border: 1px dashed var(--border-strong); border-radius: 14px;
    padding: 36px 20px; text-align: center; color: var(--text-muted);
  }

  footer {
    border-top: 1px solid var(--border);
    padding: 26px 0 40px; text-align: center;
    color: var(--text-muted); font-size: .85rem;
  }
  footer .sep { margin: 0 8px; opacity: .5; }

  @media (prefers-reduced-motion: reduce) {
    html { scroll-behavior: auto; }
    .card { animation: none; opacity: 1; transform: none; transition: none; }
    .card:hover { transform: none; }
  }
  @media (max-width: 560px) {
    .hero { padding: 56px 0 40px; }
    .avatar { width: 104px; height: 104px; }
  }
</style>
</head>
<body>
<div class="glow" aria-hidden="true"></div>

<header class="hero wrap">
  <span class="avatar-ring">
    <img class="avatar" id="avatar" src="https://avatars.githubusercontent.com/u/71749223?s=256&v=4" alt="Hossein's avatar" width="128" height="128">
  </span>
  <h1 id="name">Hossein</h1>
  <p class="handle"><a id="profile-link" href="https://github.com/hossein-bozorg-zadeh">@hossein-bozorg-zadeh</a></p>
  <p class="tagline" id="tagline">I build Telegram bots and developer tools — Python, TypeScript, Cloudflare&nbsp;Workers.</p>
  <div class="stats" id="stats" aria-label="GitHub stats"></div>
</header>

<main class="projects wrap" id="projects-section">
  <div class="section-head">
    <h2>Pinned projects</h2>
    <p class="sync-note" id="sync-note"><span class="dot" aria-hidden="true"></span>Synced from GitHub pinned repos</p>
  </div>
  <div class="grid" id="projects">
    <div class="empty" id="placeholder">Loading pinned projects…</div>
  </div>
</main>

<footer>
  <div class="wrap">
    <span id="foot-note">Pinned projects refresh automatically every 6 hours</span>
    <span class="sep">·</span>
    <a href="https://github.com/hossein-bozorg-zadeh">GitHub</a>
    <span class="sep">·</span>
    <span id="generated"></span>
  </div>
</footer>

<script>
(function () {
  var LOGIN = "hossein-bozorg-zadeh";
  var FALLBACK_COLORS = {
    Python: "#3572A5", TypeScript: "#3178c6", JavaScript: "#f1e05a",
    HTML: "#e34c26", CSS: "#563d7c", Go: "#00ADD8", Rust: "#dea584",
    Kotlin: "#A97BFF", Java: "#b07219", PHP: "#4F5D95", C: "#555555",
    "C++": "#f34b7d", "C#": "#178600", Shell: "#89e051", Vue: "#41b883",
    Dart: "#00B4AB", Swift: "#F05138", Ruby: "#701516", Lua: "#000080"
  };
  var ICONS = {
    repo: '<svg class="repo-icon" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M2 2.5A2.5 2.5 0 0 1 4.5 0h8.75a.75.75 0 0 1 .75.75v12.5a.75.75 0 0 1-.75.75h-2.5a.75.75 0 0 1 0-1.5h1.75v-2h-8a1 1 0 0 0-.714 1.7.75.75 0 1 1-1.072 1.05A2.495 2.495 0 0 1 2 11.5Zm10.5-1h-8a1 1 0 0 0-1 1v6.708A2.486 2.486 0 0 1 4.5 9h8ZM5 12.25a.25.25 0 0 1 .25-.25h3.5a.25.25 0 0 1 .25.25v3.25a.25.25 0 0 1-.4.2l-1.45-1.087a.249.249 0 0 0-.3 0L5.4 15.7a.25.25 0 0 1-.4-.2Z"/></svg>',
    star: '<svg viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M8 .25a.75.75 0 0 1 .673.418l1.882 3.815 4.21.612a.75.75 0 0 1 .416 1.279l-3.046 2.97.719 4.192a.751.751 0 0 1-1.088.791L8 12.347l-3.766 1.98a.75.75 0 0 1-1.088-.79l.72-4.194L.818 6.374a.75.75 0 0 1 .416-1.28l4.21-.611L7.327.668A.75.75 0 0 1 8 .25Z"/></svg>',
    fork: '<svg viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M5 5.372v.878c0 .414.336.75.75.75h4.5a.75.75 0 0 0 .75-.75v-.878a2.25 2.25 0 1 1 1.5 0v.878a2.25 2.25 0 0 1-2.25 2.25h-1.5v2.128a2.251 2.251 0 1 1-1.5 0V8.5h-1.5A2.25 2.25 0 0 1 3.5 6.25v-.878a2.25 2.25 0 1 1 1.5 0ZM5 3.25a.75.75 0 1 0-1.5 0 .75.75 0 0 0 1.5 0Zm6.75.75a.75.75 0 1 0 0-1.5.75.75 0 0 0 0 1.5Zm-3 8.75a.75.75 0 1 0-1.5 0 .75.75 0 0 0 1.5 0Z"/></svg>',
    ext: '<svg viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M3.75 2h3.5a.75.75 0 0 1 0 1.5h-3.5a.25.25 0 0 0-.25.25v8.5c0 .138.112.25.25.25h8.5a.25.25 0 0 0 .25-.25v-3.5a.75.75 0 0 1 1.5 0v3.5A1.75 1.75 0 0 1 12.25 14h-8.5A1.75 1.75 0 0 1 2 12.25v-8.5A1.75 1.75 0 0 1 3.75 2Zm6.854-1h4a.75.75 0 0 1 .75.75v4a.75.75 0 0 1-1.5 0V3.56l-3.723 3.723a.75.75 0 1 1-1.06-1.06L12.794 2.5H10.604a.75.75 0 0 1 0-1.5Z"/></svg>',
    link: '<svg viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M7.775 3.275a.75.75 0 0 0 1.06 1.06l1.25-1.25a2 2 0 1 1 2.83 2.83l-2.5 2.5a2 2 0 0 1-2.83 0 .75.75 0 0 0-1.06 1.06 3.5 3.5 0 0 0 4.95 0l2.5-2.5a3.5 3.5 0 0 0-4.95-4.95l-1.25 1.25Zm-4.69 9.64a2 2 0 0 1 0-2.83l2.5-2.5a2 2 0 0 1 2.83 0 .75.75 0 0 0 1.06-1.06 3.5 3.5 0 0 0-4.95 0l-2.5 2.5a3.5 3.5 0 0 0 4.95 4.95l1.25-1.25a.75.75 0 0 0-1.06-1.06l-1.25 1.25a2 2 0 0 1-2.83 0Z"/></svg>',
    people: '<svg viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M2 5.5a3.5 3.5 0 1 1 5.898 2.549 5.508 5.508 0 0 1 3.034 4.084.75.75 0 1 1-1.482.235 4 4 0 0 0-7.9 0 .75.75 0 0 1-1.482-.236A5.507 5.507 0 0 1 3.102 8.05 3.493 3.493 0 0 1 2 5.5ZM11 4a3.001 3.001 0 0 1 2.22 5.018 5.01 5.01 0 0 1 2.56 3.012.749.749 0 0 1-.885.954.752.752 0 0 1-.549-.514 3.507 3.507 0 0 0-2.522-2.372.75.75 0 0 1-.574-.73v-.352a.75.75 0 0 1 .416-.672A1.5 1.5 0 0 0 11 5.5.75.75 0 0 1 11 4Zm-5.5-.5a2 2 0 1 0-.001 3.999A2 2 0 0 0 5.5 3.5Z"/></svg>',
    clock: '<svg viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M8 0a8 8 0 1 1 0 16A8 8 0 0 1 8 0ZM1.5 8a6.5 6.5 0 1 0 13 0 6.5 6.5 0 0 0-13 0Zm7-3.25v3.5l2.03 1.17a.75.75 0 0 1-.75 1.3L7.5 9.14a.75.75 0 0 1-.375-.65v-3.74a.75.75 0 0 1 1.5 0Z"/></svg>'
  };

  function el(tag, cls, html) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (html != null) n.innerHTML = html;
    return n;
  }

  function fmtMonth(iso) {
    var d = new Date(iso);
    if (isNaN(d)) return "";
    return d.toLocaleString("en", { month: "short", year: "numeric" });
  }

  function repoCard(r, i) {
    var color = r.language_color || FALLBACK_COLORS[r.language] || "#8b94a8";
    var card = el("article", "card");
    card.style.animationDelay = Math.min(i * 70, 420) + "ms";

    var top = el("div", "card-top");
    top.innerHTML = ICONS.repo;
    var h3 = el("h3");
    var a = el("a", null, null);
    a.href = r.url || ("https://github.com/" + (r.full_name || LOGIN + "/" + r.name));
    a.target = "_blank"; a.rel = "noopener";
    a.textContent = r.name;
    h3.appendChild(a);
    top.appendChild(h3);
    if (r.homepage) {
      var ext = el("a", "ext", ICONS.ext);
      ext.href = r.homepage; ext.target = "_blank"; ext.rel = "noopener";
      ext.setAttribute("aria-label", "Open project page");
      top.appendChild(ext);
    }
    card.appendChild(top);

    card.appendChild(el("p", "desc", r.description ? esc(r.description) : "No description yet."));

    var meta = el("div", "meta");
    if (r.language) {
      var lang = el("span", "lang");
      lang.style.setProperty("--dot", color);
      lang.innerHTML = "<i aria-hidden='true'></i>" + esc(r.language);
      meta.appendChild(lang);
    }
    if (typeof r.stars === "number") {
      meta.appendChild(el("span", "with-icon", ICONS.star + " " + r.stars));
    }
    if (typeof r.forks === "number") {
      meta.appendChild(el("span", "with-icon", ICONS.fork + " " + r.forks));
    }
    if (r.updated_at) {
      meta.appendChild(el("span", "with-icon", ICONS.clock + " " + esc(fmtMonth(r.updated_at))));
    }
    card.appendChild(meta);

    if (r.homepage) {
      var chip = el("a", "home-chip", ICONS.link + " " + esc(r.homepage.replace(/^https?:\/\//, "").replace(/\/$/, "")));
      chip.href = r.homepage; chip.target = "_blank"; chip.rel = "noopener";
      card.appendChild(chip);
    }

    var stretch = el("a", "stretch");
    stretch.href = a.href; stretch.target = "_blank"; stretch.rel = "noopener";
    stretch.setAttribute("aria-label", "Open " + r.name + " on GitHub");
    card.appendChild(stretch);
    return card;
  }

  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  function renderProfile(p) {
    if (!p) return;
    if (p.name) { document.getElementById("name").textContent = p.name; document.title = p.name + " — Portfolio"; }
    if (p.avatar_url) document.getElementById("avatar").src = p.avatar_url;
    if (p.bio) document.getElementById("tagline").textContent = p.bio;
    if (p.location) {
      document.querySelector(".handle").appendChild(document.createTextNode(" · " + p.location));
    }
    var stats = document.getElementById("stats");
    stats.innerHTML = "";
    if (typeof p.followers === "number") stats.appendChild(el("span", "stat", ICONS.people + " <b>" + p.followers + "</b> followers"));
    if (typeof p.public_repos === "number") stats.appendChild(el("span", "stat", ICONS.repo + " <b>" + p.public_repos + "</b> repositories"));
    if (p.website) {
      var w = el("a", "stat", ICONS.link + " " + esc(p.website.replace(/^https?:\/\//, "")));
      w.href = p.website; w.target = "_blank"; w.rel = "noopener";
      stats.appendChild(w);
    }
  }

  function renderRepos(list, note) {
    var grid = document.getElementById("projects");
    grid.innerHTML = "";
    if (!list || !list.length) {
      grid.appendChild(el("div", "empty", "No pinned repositories yet — pin some on the GitHub profile and this page will pick them up automatically."));
      return;
    }
    list.forEach(function (r, i) { grid.appendChild(repoCard(r, i)); });
    if (note) document.getElementById("sync-note").textContent = note;
  }

  function fallback() {
    fetch("https://api.github.com/users/" + LOGIN + "/repos?sort=stars&per_page=6")
      .then(function (res) { return res.ok ? res.json() : Promise.reject(res.status); })
      .then(function (repos) {
        renderRepos(repos.map(function (r) {
          return {
            name: r.name, description: r.description, url: r.html_url,
            homepage: r.homepage, language: r.language,
            stars: r.stargazers_count, forks: r.forks_count,
            updated_at: r.updated_at
          };
        }), "Showing top repositories (live from the GitHub API)");
      })
      .catch(function () {
        document.getElementById("projects").innerHTML =
          '<div class="error">Could not load projects. <a href="https://github.com/' + LOGIN + '">View them on GitHub →</a></div>';
      });
  }

  fetch("pinned.json?t=" + Date.now())
    .then(function (res) { return res.ok ? res.json() : Promise.reject(res.status); })
    .then(function (data) {
      renderProfile(data.profile);
      renderRepos(data.pinned);
      if (data.generated_at) {
        var d = new Date(data.generated_at);
        if (!isNaN(d)) {
          document.getElementById("generated").textContent =
            "Last sync: " + d.toLocaleString("en", { month: "short", day: "numeric", year: "numeric" });
        }
      }
      if (data.source === "fallback") {
        document.getElementById("sync-note").textContent = "Showing top repositories (pinned sync temporarily unavailable)";
      }
    })
    .catch(fallback);
})();
</script>
</body>
</html>
